<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-tXrrUbrQrXvlsNakju9jtAiefWeeeisdlDpYTtp/LaM='; style-src 'sha256-gHO5odZWgnI6o8+5JUz7G22HjxOQHGn8jl+1mOP5Q1o='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>FM-1 Input Monitor</title>
<style>:root {
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #5f6368;
  --line: #c9c9cf;
  --panel: #f5f5f7;
  --accent: #1d1d1f;
  --accent-fg: #ffffff;
  --ok: #1e7b34;
  --ng: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --fg: #ececf0;
    --muted: #a0a0a8;
    --line: #3a3a40;
    --panel: #212125;
    --accent: #ececf0;
    --accent-fg: #161618;
    --ok: #6fcf86;
    --ng: #ff8a80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.6rem; margin: 8px 0 12px; }
h2 { font-size: 1.1rem; margin: 32px 0 8px; }
p, ul, ol { margin: 8px 0; }
a { color: inherit; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
.lang { display: flex; justify-content: flex-end; gap: 4px; }
.lang button {
  font: inherit; font-size: 0.85rem; padding: 2px 10px; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
}
.lang button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.local { color: var(--muted); }
.warn { border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px 8px; margin-top: 20px; }
.warn h2 { margin-top: 12px; }
.drop {
  border: 2px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center;
  background: var(--panel);
}
.drop.over { border-color: var(--fg); }
.pick { cursor: pointer; text-decoration: underline; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.pick:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }
.checks { list-style: none; padding: 0; }
.checks .ok { color: var(--ok); }
.checks .ng { color: var(--ng); }
.error { color: var(--ng); }
details pre { background: var(--panel); padding: 8px 12px; border-radius: 6px; overflow-x: auto; }
.button {
  display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none;
  background: var(--accent); color: var(--accent-fg); font-weight: 600;
}
.sha { color: var(--muted); font-size: 0.9rem; }
.sha code { word-break: break-all; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.9rem; }

main.wide { max-width: 1040px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0 4px; }
.controls .button { border: 0; cursor: pointer; font: inherit; font-weight: 600; }
.select { display: inline-flex; align-items: center; gap: 8px; }
.select select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); max-width: 60vw; }
.status { color: var(--ng); }
.status.ok { color: var(--ok); }
.layout { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #ffffff; }
.layout svg { display: block; width: 100%; height: auto; }
.layout [data-note], .layout [data-knob] { transition: fill 60ms; }
.layout .lit { fill: #ffcf33; }
.layout .arrow { fill: #e4e4e8; }
.layout .arrow.lit { fill: #e09b00; }
.small { font: inherit; font-size: 0.8rem; padding: 0 10px; margin-left: 8px; cursor: pointer; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; vertical-align: middle; }
.log { list-style: none; padding: 0; margin: 8px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; }
.log li { padding: 2px 0; border-bottom: 1px solid var(--line); }
.log .num { display: inline-block; min-width: 3ch; text-align: right; font-weight: 700; }
</style>
</head>
<body>
<main class="wide">
  <nav class="lang" aria-label="Language">
    <button id="lang-en" type="button" aria-pressed="true">English</button>
    <button id="lang-ja" type="button" aria-pressed="false">日本語</button>
  </nav>

  <h1 data-i18n="title">FM-1 Input Monitor</h1>
  <p data-i18n="lead"></p>
  <p class="local" data-i18n="local"></p>

  <div class="controls">
    <button id="start" type="button" class="button" data-i18n="start"></button>
    <label class="select"><span data-i18n="input"></span>
      <select id="input-select" disabled></select>
    </label>
    <span id="status" class="status" hidden></span>
  </div>
  <p id="start-hint" class="local" data-i18n="startHint"></p>

  <div id="layout" class="layout"></div>

  <section>
    <h2><span data-i18n="log"></span> <button id="clear" type="button" class="small" data-i18n="clear"></button></h2>
    <ol id="log" class="log" aria-live="polite"></ol>
  </section>

  <footer><a id="back-link" rel="noopener" data-i18n="back"></a></footer>
</main>
<script>// FM-1 layout diagram (schematic, line drawing on white). Single source for docs/layout*.svg and the
// input monitor. With {interactive: true} the controls carry data-note attributes and the knobs get
// direction arrows, so the monitor can light them up.
var FM1Layout = (function () {
  'use strict';

  var W = 1000, H = 640;
  var LINE = '#222222', TXT = '#222222', SUB = '#666666';

  var BUTTONS = ['FX', 'SEL', 'ENV', 'LFO', 'EDIT', 'GLO', 'HOME', 'SAVE', 'ARP', 'SEQ', 'PLAY\nSTOP', 'REC'];
  var KNOBS = {
    SELECT: [87, 95], ALGORITHM: [88, 96], KNOB1: [89, 97], KNOB2: [90, 98],
    KNOB3: [91, 99], KNOB4: [92, 100], PRESETS: [93, 101]
  };
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  var TEXT = {
    en: {
      title: 'FM-1 Macropad Patch: note numbers (MIDI channel 1)',
      legend: 'Buttons and keys: note-on when pressed, note-off when released.   Knobs: clockwise / counter-clockwise (note-on only).',
      master: 'no MIDI', screen: 'display\n(off)'
    },
    ja: {
      title: 'FM-1 マクロパッド化パッチ：ノート番号（MIDI チャンネル 1）',
      legend: 'ボタン・鍵盤：押すとノートオン、離すとノートオフ。　ノブ：時計回り / 反時計回り（ノートオンのみ）',
      master: 'MIDIなし', screen: '画面\n（消灯）'
    }
  };

  // What each note number means: {kind: 'button'|'key'|'knob', name, dir?}
  function describe(note) {
    if (note >= 39 && note <= 52) {
      var names = ['OCT−', 'OCT+'].concat(BUTTONS.map(function (b) { return b.replace('\n', '/'); }));
      return { kind: 'button', name: names[note - 39] };
    }
    if (note >= 53 && note <= 79) {
      return { kind: 'key', name: NOTE_NAMES[note % 12] + (Math.floor(note / 12) - 1) };
    }
    for (var k in KNOBS) {
      if (KNOBS[k][0] === note) return { kind: 'knob', name: k, dir: 'cw' };
      if (KNOBS[k][1] === note) return { kind: 'knob', name: k, dir: 'ccw' };
    }
    return null;
  }

  function attr(note, on) { return on && note != null ? ' data-note="' + note + '"' : ''; }

  function text(x, y, s, size, fill, weight) {
    size = size || 13; fill = fill || '#222222'; weight = weight || 'normal';
    var lines = s.split('\n');
    return lines.map(function (line, i) {
      var dy = (i - (lines.length - 1) / 2) * (size * 1.15);
      return '<text x="' + x + '" y="' + (y + dy).toFixed(1) + '" font-size="' + size + '" fill="' + fill +
        '" text-anchor="middle" dominant-baseline="central" font-weight="' + weight + '">' + line + '<\/text>';
    }).join('\n');
  }

  function knob(x, y, name, label, labelSub, interactive) {
    var notes = KNOBS[name];
    var s = ['<circle cx="' + x + '" cy="' + y + '" r="17" fill="none" stroke="' + LINE + '" stroke-width="2"' +
             (interactive && notes ? ' data-knob="' + name + '"' : '') + '/>',
             '<line x1="' + x + '" y1="' + (y - 6) + '" x2="' + x + '" y2="' + (y - 15) + '" stroke="' + LINE + '" stroke-width="2"/>',
             text(x, y - 32, name, 12, SUB)];
    s.push(text(x, y + 32, label, 14, labelSub ? SUB : TXT, labelSub ? 'normal' : 'bold'));
    if (interactive && notes) {
      // Small arrows beside the knob: right = clockwise, left = counter-clockwise.
      s.push('<path d="M' + (x + 22) + ' ' + (y - 8) + ' l9 8 l-9 8 z" class="arrow" data-note="' + notes[0] + '"/>');
      s.push('<path d="M' + (x - 22) + ' ' + (y - 8) + ' l-9 8 l9 8 z" class="arrow" data-note="' + notes[1] + '"/>');
    }
    return s.join('\n');
  }

  function svg(lang, opts) {
    var t = TEXT[lang] || TEXT.en;
    var on = !!(opts && opts.interactive);
    var s = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"' +
             (on ? ' class="fm1" role="img" aria-label="FM-1"' : ' width="' + W + '" height="' + H + '"') +
             ' font-family="Helvetica, Arial, \'Hiragino Sans\', \'Noto Sans JP\', sans-serif">',
             '<rect width="' + W + '" height="' + H + '" fill="#ffffff"/>',
             text(W / 2, 24, t.title, 18, '#222', 'bold'),
             '<rect x="20" y="48" width="' + (W - 40) + '" height="520" rx="28" fill="none" stroke="' + LINE + '" stroke-width="2.5"/>'];
    // Knobs on the left
    s.push(knob(80, 110, 'MASTER', t.master, true, on));
    s.push(knob(170, 110, 'SELECT', '87 / 95', false, on));
    s.push(knob(80, 205, 'PRESETS', '93 / 101', false, on));
    s.push(knob(170, 205, 'ALGORITHM', '88 / 96', false, on));
    // Display
    s.push('<rect x="235" y="70" width="170" height="170" rx="12" fill="none" stroke="' + LINE + '" stroke-width="1.5" stroke-dasharray="6 4"/>');
    s.push(text(320, 155, t.screen, 13, SUB));
    // KNOB1-4
    [560, 665, 770, 875].forEach(function (x, i) {
      var name = 'KNOB' + (i + 1);
      s.push(knob(x, 110, name, KNOBS[name][0] + ' / ' + KNOBS[name][1], false, on));
    });
    // OCT-/OCT+
    [['OCT−', 39], ['OCT+', 40]].forEach(function (b, i) {
      var x = 55 + i * 75;
      s.push('<rect x="' + x + '" y="262" width="62" height="30" rx="6" fill="none" stroke="' + LINE + '" stroke-width="1.5"' + attr(b[1], on) + '/>');
      s.push(text(x + 31, 277, b[0], 12, TXT));
      s.push(text(x + 31, 307, String(b[1]), 14, TXT, 'bold'));
    });
    // 12 buttons
    s.push('<rect x="455" y="170" width="505" height="150" rx="14" fill="none" stroke="' + SUB + '" stroke-width="1"/>');
    BUTTONS.forEach(function (name, k) {
      var col = k % 6, row = Math.floor(k / 6);
      var x = 470 + col * 81, y = 182 + row * 68;
      s.push('<rect x="' + x + '" y="' + y + '" width="70" height="36" rx="6" fill="none" stroke="' + LINE + '" stroke-width="1.5"' + attr(41 + k, on) + '/>');
      s.push(text(x + 35, y + 18, name, name.indexOf('\n') >= 0 ? 11 : 13, TXT));
      s.push(text(x + 35, y + 50, String(41 + k), 14, TXT, 'bold'));
    });
    // 27 keys (F3 = 53 to G5 = 79)
    s.push('<rect x="38" y="340" width="' + (W - 76) + '" height="215" rx="18" fill="none" stroke="' + SUB + '" stroke-width="1"/>');
    var kw = 56, x0 = 52, wx = {}, n, i = 0;
    for (n = 53; n < 80; n++) {
      if ([0, 2, 4, 5, 7, 9, 11].indexOf(n % 12) < 0) continue;
      var xw = x0 + i * kw;
      wx[n] = xw; i++;
      s.push('<rect x="' + (xw + 6) + '" y="450" width="' + (kw - 12) + '" height="92" rx="20" fill="none" stroke="' + LINE + '" stroke-width="1.5"' + attr(n, on) + '/>');
      s.push(text(xw + kw / 2, 496, String(n), 13, TXT, 'bold'));
    }
    for (n = 53; n < 80; n++) {
      if ([1, 3, 6, 8, 10].indexOf(n % 12) < 0) continue;
      var xb = wx[n - 1] + kw / 2;
      s.push('<rect x="' + (xb + 10) + '" y="352" width="' + (kw - 20) + '" height="84" rx="18" fill="none" stroke="' + LINE + '" stroke-width="1.5"' + attr(n, on) + '/>');
      s.push(text(xb + kw / 2, 394, String(n), 13, TXT, 'bold'));
    }
    if (!on) s.push(text(W / 2, 600, t.legend, 13, '#333'));
    s.push('<\/svg>');
    return s.join('\n');
  }

  return { svg: svg, describe: describe };
})();

if (typeof module !== 'undefined') module.exports = FM1Layout;

// Input monitor: receives MIDI from the patched FM-1 with Web MIDI and lights up the matching control.
(function () {
  'use strict';
  var REPO = 'https://github.com/smememe/fm1-macropad-patch';
  var LOG_MAX = 30;
  var KNOB_FLASH_MS = 250;

  var STR = {
    en: {
      title: 'FM-1 Input Monitor',
      lead: 'Shows which control of the patched FM-1 sends which note. Press a button or key, or turn a knob.',
      local: 'Runs entirely in this page. Nothing is sent anywhere.',
      input: 'MIDI input',
      allInputs: 'All inputs',
      start: 'Connect',
      startHint: 'Your browser will ask for permission to use MIDI devices.',
      noSupport: 'This browser does not support Web MIDI. Please open this page in Chrome or Edge.',
      denied: 'Access to MIDI devices was not allowed. Allow it in the browser settings and reload the page.',
      noInputs: 'No MIDI input found. Connect the FM-1 over USB.',
      listening: 'Listening',
      log: 'Recent input',
      clear: 'Clear',
      on: 'on', off: 'off',
      cw: 'clockwise', ccw: 'counter-clockwise',
      other: 'not an FM-1 note',
      back: 'Patcher and README'
    },
    ja: {
      title: 'FM-1 入力モニター',
      lead: '改造した FM-1 のどの入力が何番のノートを送るかを表示します。ボタンや鍵盤を押したり、ノブを回したりしてください。',
      local: '処理はすべてこのページの中で行います。どこにも送信しません。',
      input: 'MIDI 入力',
      allInputs: 'すべての入力',
      start: '接続する',
      startHint: 'ブラウザが MIDI 機器の使用許可を求めます。',
      noSupport: 'このブラウザは Web MIDI に対応していません。Chrome か Edge で開いてください。',
      denied: 'MIDI 機器へのアクセスが許可されませんでした。ブラウザの設定で許可してから、ページを再読み込みしてください。',
      noInputs: 'MIDI 入力が見つかりません。FM-1 を USB でつないでください。',
      listening: '受信中',
      log: '最近の入力',
      clear: '消去',
      on: 'オン', off: 'オフ',
      cw: '時計回り', ccw: '反時計回り',
      other: 'FM-1 のノートではありません',
      back: 'パッチャーと README'
    }
  };

  var lang = /^ja\b/i.test(navigator.language || '') ? 'ja' : 'en';
  var access = null;
  var selected = 'all';
  var log = [];
  var status = null;

  function $(id) { return document.getElementById(id); }
  function t(key) { return STR[lang][key]; }

  function drawLayout() {
    $('layout').innerHTML = FM1Layout.svg(lang, { interactive: true });
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
    $('lang-ja').setAttribute('aria-pressed', String(lang === 'ja'));
    $('back-link').href = REPO + (lang === 'ja' ? '/blob/main/README.ja.md' : '#readme');
    drawLayout();
    renderInputs();
    renderStatus();
    renderLog();
  }

  function setStatus(key) { status = key; renderStatus(); }
  function renderStatus() {
    var el = $('status');
    el.textContent = status ? t(status) : '';
    el.className = status === 'listening' ? 'status ok' : 'status';
    el.hidden = !status;
  }

  function label(note, cmd) {
    var d = FM1Layout.describe(note);
    if (!d) return t('other');
    if (d.kind === 'knob') return d.name + ' ' + t(d.dir);
    return d.name + ' ' + t(cmd === 'on' ? 'on' : 'off');
  }

  function renderLog() {
    var list = $('log');
    list.textContent = '';
    log.forEach(function (e) {
      var li = document.createElement('li');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(e.note);
      li.appendChild(num);
      li.appendChild(document.createTextNode(' ' + label(e.note, e.cmd) + '  (vel ' + e.vel + ', ch ' + e.ch + ')'));
      list.appendChild(li);
    });
  }

  function light(note, onOff) {
    var els = document.querySelectorAll('#layout [data-note="' + note + '"]');
    for (var i = 0; i < els.length; i++) els[i].classList.toggle('lit', onOff);
    var d = FM1Layout.describe(note);
    if (d && d.kind === 'knob') {
      var k = document.querySelector('#layout [data-knob="' + d.name + '"]');
      if (k) k.classList.toggle('lit', onOff);
    }
  }

  function flashKnob(note) {
    light(note, true);
    setTimeout(function () { light(note, false); }, KNOB_FLASH_MS);
  }

  // Handles one MIDI message (array of bytes). Exposed for testing from the console.
  function handle(data) {
    var status = data[0] & 0xF0, ch = (data[0] & 0x0F) + 1;
    if (status !== 0x90 && status !== 0x80) return;
    var note = data[1], vel = data[2];
    var cmd = status === 0x90 && vel > 0 ? 'on' : 'off';
    var d = FM1Layout.describe(note);
    if (d && d.kind === 'knob') {
      if (cmd === 'on') flashKnob(note);
    } else {
      light(note, cmd === 'on');
    }
    log.unshift({ note: note, cmd: cmd, vel: vel, ch: ch });
    if (log.length > LOG_MAX) log.length = LOG_MAX;
    renderLog();
  }

  function inputs() {
    var out = [];
    if (access) access.inputs.forEach(function (i) { out.push(i); });
    return out;
  }

  function renderInputs() {
    var sel = $('input-select');
    sel.textContent = '';
    var all = document.createElement('option');
    all.value = 'all';
    all.textContent = t('allInputs');
    sel.appendChild(all);
    inputs().forEach(function (i) {
      var o = document.createElement('option');
      o.value = i.id;
      o.textContent = i.name || i.id;
      sel.appendChild(o);
    });
    sel.value = selected;
    if (sel.value !== selected) { selected = 'all'; sel.value = 'all'; }
    sel.disabled = !access;
  }

  function attach() {
    var list = inputs();
    list.forEach(function (i) {
      i.onmidimessage = (selected === 'all' || selected === i.id) ? function (e) { handle(e.data); } : null;
    });
    if (access) setStatus(list.length ? 'listening' : 'noInputs');
  }

  function autoSelect() {
    var fm1 = inputs().filter(function (i) { return /FM-?1/i.test(i.name || ''); });
    if (fm1.length === 1) selected = fm1[0].id;
  }

  function start() {
    if (!navigator.requestMIDIAccess) { setStatus('noSupport'); return; }
    navigator.requestMIDIAccess({ sysex: false }).then(function (a) {
      access = a;
      autoSelect();
      renderInputs();
      attach();
      $('start').hidden = true;
      $('start-hint').hidden = true;
      a.onstatechange = function () { renderInputs(); attach(); };
    }, function () { setStatus('denied'); });
  }

  function setup() {
    $('lang-en').addEventListener('click', function () { lang = 'en'; applyLang(); });
    $('lang-ja').addEventListener('click', function () { lang = 'ja'; applyLang(); });
    $('start').addEventListener('click', start);
    $('input-select').addEventListener('change', function (e) { selected = e.target.value; attach(); });
    $('clear').addEventListener('click', function () { log = []; renderLog(); });
    if (!navigator.requestMIDIAccess) {
      status = 'noSupport';
      $('start').hidden = true;
      $('start-hint').hidden = true;
    }
    applyLang();
    window.FM1Monitor = { handle: handle };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();
</script>
</body>
</html>
